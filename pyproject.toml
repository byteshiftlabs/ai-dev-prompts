[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-mcp"
version = "1.0.0"
description = "MCP server that exposes the rubric prompt toolkit as agent-callable tools"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.27.1",
    "pyyaml==6.0.3",
]

[tool.setuptools]
py-modules = ["rubric_mcp"]
