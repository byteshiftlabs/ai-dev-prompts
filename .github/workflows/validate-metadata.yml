name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate prompt-pack metadata
        run: python3 scripts/validate_metadata.py

  test-mcp-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test dependencies
        run: pip install .[dev]

      - name: Run rubric_mcp.py tests
        run: python3 -m pytest tests/ -q